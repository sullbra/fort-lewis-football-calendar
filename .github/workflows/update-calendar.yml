name: Update and publish Fort Lewis football calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fort-lewis-football-calendar
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update football calendar
        run: python scripts/update_calendar.py

      - name: Commit calendar changes
        shell: bash
        run: |
          if git diff --quiet -- fort-lewis-football.ics; then
            echo "No calendar changes found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fort-lewis-football.ics
            git commit -m "Update Fort Lewis football calendar"
            git push
          fi

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          mkdir -p _site
          cp fort-lewis-football.ics _site/fort-lewis-football.ics

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
